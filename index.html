<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f5f7">
    <meta name="description" content="Gere e pratique tabuadas de forma simples e interativa.">
    <title>Gerador de Tabuada Interativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="pagina">
        <header class="cabecalho">
            <p class="eyebrow">MATEMÁTICA, SEM COMPLICAÇÃO</p>
            <h1>Aprender pode ser <span>simples.</span></h1>
            <p class="introducao">Escolha um número e explore a tabuada de 1 a 10.</p>
        </header>

        <section class="painel" aria-labelledby="form-title">
            <h2 id="form-title">Sua tabuada</h2>
            <form id="form-tabuada" class="entrada" novalidate>
                <label for="numero">Qual número você quer estudar?</label>
                <div class="controles">
                    <input
                        type="number"
                        id="numero"
                        name="numero"
                        min="1"
                        max="10"
                        step="1"
                        inputmode="numeric"
                        placeholder="Ex.: 7"
                        aria-describedby="dica-numero"
                        required
                    >
                    <button type="submit">Ver tabuada <span aria-hidden="true">→</span></button>
                </div>
                <p id="dica-numero" class="dica">Digite um número inteiro de 1 a 10.</p>
                <p id="mensagem" class="mensagem" role="alert" aria-live="polite"></p>
            </form>

            <section id="resultado" class="saida" aria-labelledby="titulo-resultado" aria-live="polite" hidden>
                <h2 id="titulo-resultado"></h2>
                <ol id="lista-tabuada" class="lista-tabuada"></ol>
            </section>
        </section>

        <footer class="rodape">
            <p>Um passo de cada vez. Você consegue.</p>
        </footer>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
